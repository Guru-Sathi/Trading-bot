<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Algorithmic Trading Strategies{% endblock %}</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Add some custom styles to elevate the look */
        body {
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc; /* Slate 50 */
            font-family: 'Inter', sans-serif;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7); /* Slate 800 with opacity */
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">
    <!-- Navbar -->
    <nav class="glass-panel sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="flex-shrink-0 flex items-center gap-2">
                        <!-- Icon -->
                        <svg class="h-8 w-8 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
                        </svg>
                        <span class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-cyan-400">
                            Algo Dashboard
                        </span>
                    </a>
                </div>
                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-4">
                        <a href="/" class="text-gray-300 hover:text-white hover:bg-slate-700 px-3 py-2 rounded-md text-sm font-medium transition-colors">Strategies</a>
                        <a href="/watchlist" class="text-gray-300 hover:text-white hover:bg-slate-700 px-3 py-2 rounded-md text-sm font-medium transition-colors flex items-center gap-1">
                            <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>
                            Watchlist
                        </a>
                        <a href="/paper-trading" class="text-gray-300 hover:text-white hover:bg-slate-700 px-3 py-2 rounded-md text-sm font-medium transition-colors flex items-center gap-1">
                            <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Paper Trading
                        </a>
                        <a href="#" class="text-gray-300 hover:text-white hover:bg-slate-700 px-3 py-2 rounded-md text-sm font-medium transition-colors">Settings</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>

    <!-- Main Content -->
    <main class="flex-grow">
        <div class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Footer -->
    <footer class="glass-panel mt-auto">
        <div class="max-w-7xl mx-auto py-4 px-4 sm:px-6 lg:px-8">
            <p class="text-center text-sm text-slate-400">
                &copy; 2024 Algo Dashboard. Trading involves risk.
            </p>
        </div>
    </footer>

    <!-- Global Watchlist Utilities -->
    <script>
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toastId = 'toast-' + Date.now();

            let colorClasses = type === 'success'
                ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-400 shadow-[0_0_10px_rgba(16,185,129,0.3)]'
                : 'bg-rose-500/20 border-rose-500/50 text-rose-400 shadow-[0_0_10px_rgba(244,63,94,0.3)]';

            const icon = type === 'success'
                ? `<svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`
                : `<svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;

            const toastHTML = `
                <div id="${toastId}" class="flex items-center p-4 mb-2 border rounded-lg glass-panel backdrop-blur-md transition-all duration-300 transform translate-y-0 opacity-100 ${colorClasses}" role="alert">
                    ${icon}
                    <div class="text-sm font-medium">${message}</div>
                </div>
            `;

            container.insertAdjacentHTML('beforeend', toastHTML);

            // Auto remove after 3 seconds
            setTimeout(() => {
                const el = document.getElementById(toastId);
                if(el) {
                    el.classList.replace('translate-y-0', 'translate-y-2');
                    el.classList.replace('opacity-100', 'opacity-0');
                    setTimeout(() => el.remove(), 300);
                }
            }, 3000);
        }

        // --- Watchlist LocalStorage CRUD ---
        const WATCHLIST_KEY = 'algo_dashboard_watchlist';
        window.WATCHLIST_KEY = WATCHLIST_KEY; // Explicitly attach to window for global access

        function getWatchlist() {
            try {
                const data = localStorage.getItem(WATCHLIST_KEY);
                return data ? JSON.parse(data) : [];
            } catch (e) {
                return [];
            }
        }

        function addToWatchlist(stock, ltp, strategy, metricLabel, metricValue) {
            let watchlist = getWatchlist();

            // Prevent duplicates based on stock and strategy
            const exists = watchlist.find(item => item.stock === stock && item.strategy === strategy);
            if (exists) {
                showToast(`${stock} is already in Watchlist from ${strategy}`, 'error');
                return;
            }

            const newItem = {
                id: Date.now().toString(),
                stock: stock,
                ltp: ltp,
                strategy: strategy,
                metricLabel: metricLabel,
                metricValue: metricValue,
                dateAdded: new Date().toLocaleString()
            };

            watchlist.push(newItem);
            localStorage.setItem(WATCHLIST_KEY, JSON.stringify(watchlist));
            showToast(`Added ${stock} to Watchlist!`);
        }

        function removeFromWatchlist(id) {
            let watchlist = getWatchlist();
            watchlist = watchlist.filter(item => item.id !== id);
            localStorage.setItem(WATCHLIST_KEY, JSON.stringify(watchlist));
            showToast('Removed from Watchlist.', 'success');
        }

        // Expose to window for inline onclick handlers
        window.addToWatchlist = addToWatchlist;
        window.removeFromWatchlist = removeFromWatchlist;
        window.getWatchlist = getWatchlist;
    </script>
</body>
</html>
